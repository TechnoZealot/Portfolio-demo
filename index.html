    // --- Interactive HTML5 Canvas: Matrix-Dot Grid with Perspective Ripple ---
    function MatrixGridCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let animationFrameId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const mouse = {
          x: width * 0.5,
          y: height * 0.4,
          targetX: width * 0.5,
          targetY: height * 0.4,
          radius: 170,
          isActive: false,
        };

        const SPACING = 34;
        let points = [];

        const initPoints = () => {
          points = [];
          const cols = Math.ceil(width / SPACING) + 2;
          const rows = Math.ceil(height / SPACING) + 2;

          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const bx = c * SPACING;
              const by = r * SPACING;
              points.push({
                baseX: bx,
                baseY: by,
                x: bx,
                y: by,
              });
            }
          }
        };

        const handleResize = () => {
          const dpr = window.devicePixelRatio || 1;
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = width * dpr;
          canvas.height = height * dpr;
          canvas.style.width = width + 'px';
          canvas.style.height = height + 'px';
          ctx.scale(dpr, dpr);
          initPoints();
        };

        handleResize();

        const handleMouseMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          mouse.targetX = e.clientX - rect.left;
          mouse.targetY = e.clientY - rect.top;
          mouse.isActive = true;
        };

        const handleMouseLeave = () => {
          mouse.isActive = false;
        };

        window.addEventListener('resize', handleResize);
        window.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseleave', handleMouseLeave);

        let time = 0;

        const render = () => {
          time += 0.02;

          mouse.x += (mouse.targetX - mouse.x) * 0.12;
          mouse.y += (mouse.targetY - mouse.y) * 0.12;

          ctx.clearRect(0, 0, width, height);

          const len = points.length;
          for (let i = 0; i < len; i++) {
            const pt = points[i];

            const idleWave =
              Math.sin(pt.baseX * 0.008 + pt.baseY * 0.008 + time) * 3 +
              Math.cos(pt.baseX * 0.012 - time * 0.8) * 2;

            const dx = mouse.x - pt.baseX;
            const dy = mouse.y - pt.baseY;
            const dist = Math.sqrt(dx * dx + dy * dy);

            let pushX = 0;
            let pushY = 0;
            let intensity = 0;

            if (dist < mouse.radius && mouse.isActive) {
              const factor = 1 - dist / mouse.radius;
              const power = Math.sin(factor * Math.PI) * 22;
              const angle = Math.atan2(dy, dx);
              pushX = -Math.cos(angle) * power;
              pushY = -Math.sin(angle) * power;
              intensity = factor;
            }

            const targetX = pt.baseX + pushX;
            const targetY = pt.baseY + pushY + idleWave;

            pt.x += (targetX - pt.x) * 0.2;
            pt.y += (targetY - pt.y) * 0.2;

            let radius = 1.15;
            let alpha = 0.22;
            let fill = 'rgba(16, 185, 129, ';

            if (intensity > 0.05) {
              radius = 1.2 + intensity * 2.4;
              alpha = 0.35 + intensity * 0.65;
              fill = intensity > 0.5 ? 'rgba(163, 230, 53, ' : 'rgba(52, 211, 153, ';

              if (intensity > 0.65) {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, radius * 2.8, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(16, 185, 129, ${intensity * 0.2})`;
                ctx.fill();
              }
            }

            ctx.beginPath();
            ctx.arc(pt.x, pt.y, radius, 0, Math.PI * 2);
            ctx.fillStyle = fill + alpha + ')';
            ctx.fill();
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseleave', handleMouseLeave);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-none z-0 opacity-80"
          aria-hidden="true"
        />
      );
    }

      const cardRef = useRef(null);
      const [transform, setTransform] = useState('perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px) scale3d(1, 1, 1)');
      const [glare, setGlare] = useState({ x: 50, y: 50, opacity: 0 });
      const [isHovered, setIsHovered] = useState(false);

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = ((y - centerY) / centerY) * -8;
        const rotateY = ((x - centerX) / centerX) * 8;

        setTransform(
          `perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) translateY(-6px) scale3d(1.02, 1.02, 1.02)`
        );

        setGlare({
          x: (x / rect.width) * 100,
          y: (y / rect.height) * 100,
          opacity: 1,
        });
      };

      const handleMouseEnter = () => setIsHovered(true);

      const handleMouseLeave = () => {
        setIsHovered(false);
        setTransform('perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px) scale3d(1, 1, 1)');
        setGlare((prev) => ({ ...prev, opacity: 0 }));
      };

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseEnter={handleMouseEnter}
          onMouseLeave={handleMouseLeave}
          style={{
            transform,
            transition: isHovered
              ? 'transform 0.1s ease-out, box-shadow 0.25s ease'
              : 'transform 0.45s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.45s ease',
            transformStyle: 'preserve-3d',
          }}
          className={`relative flex flex-col justify-between rounded-2xl bg-[#0d1117]/80 backdrop-blur-xl border border-emerald-500/20 p-6 sm:p-7 overflow-hidden will-change-transform ${
            isHovered
              ? 'border-emerald-400/60 shadow-[0_12px_35px_rgba(0,0,0,0.8),0_0_30px_rgba(16,185,129,0.3)]'
              : 'shadow-[0_8px_24px_rgba(0,0,0,0.6)]'
          }`}
        >
          <div
            className="pointer-events-none absolute inset-0 rounded-2xl transition-opacity duration-300 z-10"
            style={{
              opacity: glare.opacity,
              background: `radial-gradient(circle 280px at ${glare.x}% ${glare.y}%, rgba(16, 185, 129, 0.18), rgba(163, 230, 53, 0.08) 35%, transparent 70%)`,
            }}
          />

          <div className="absolute top-0 right-0 w-16 h-16 pointer-events-none overflow-hidden">
            <div className="absolute top-2 right-2 w-2 h-2 border-t-2 border-r-2 border-emerald-400/50" />

          <div>
